<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>MAKI</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #canvas {
        display: block;
        visibility: hidden;
        width: min(100vw, calc(100vh * 16 / 9)) !important;
        height: min(100vh, calc(100vw * 9 / 16)) !important;
        outline: none;
      }

      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c07351;
        font: 24px monospace;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading MAKI…</div>
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

    <script>
      var loading = document.getElementById("loading");
      var canvas = document.getElementById("canvas");

      window.onload = function () { window.focus(); canvas.focus(); };
      window.onclick = function () { window.focus(); canvas.focus(); };

      window.addEventListener("keydown", function (event) {
        if ([9, 32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
          event.preventDefault();
        }
      }, false);

      canvas.addEventListener("webglcontextlost", function (event) {
        alert("WebGL context lost. Please reload the page.");
        event.preventDefault();
      }, false);

      var Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 268435456,
        printErr: console.error.bind(console),
        canvas: canvas,
        totalDependencies: 0,
        remainingDependencies: 0,
        setStatus: function (text) {
          if (text) {
            loading.textContent = text;
          } else if (Module.remainingDependencies === 0) {
            loading.style.display = "none";
            canvas.style.visibility = "visible";
          }
        },
        monitorRunDependencies: function (left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? "Loading MAKI… " + (this.totalDependencies - left) + "/" + this.totalDependencies : "");
        }
      };

      Module.setStatus("Loading MAKI…");

      window.onerror = function () {
        if (canvas.style.visibility !== "visible") {
          loading.style.display = "flex";
          loading.textContent = "Something went wrong. Please reload the page.";
        }
      };
    </script>
    <script src="game.js"></script>
    <script async src="love.js" onload="Love(Module)"></script>
  </body>
</html>
